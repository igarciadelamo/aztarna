<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aztarna Dev Console</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; color: #111; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } a { color: #8bf; } }
  fieldset { margin: 0 0 12px; }
  input { width: 9em; }
  #name { width: 16em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #8884; padding: 4px 6px; text-align: left; vertical-align: top; }
  .ok { color: #1a7f37; font-weight: 600; }
  .no { color: #b35900; }
  pre { overflow: auto; max-height: 40em; background: #8881; padding: 8px; }
  #places button { margin: 2px; }
</style>
</head>
<body>
<h1>Aztarna Dev Console</h1>
<p>Local testing only. Times are shown in your browser's time zone; the API returns UTC.</p>

<fieldset>
  <legend>Location</legend>
  <form id="search">
    <input id="name" placeholder="Place name, e.g. Bilbao">
    <button>Search</button>
    <button type="button" id="here">Use my location</button>
  </form>
  <div id="places"></div>
  <form id="coords">
    lat <input id="lat" type="number" step="0.1" min="-90" max="90" value="40.4" required>
    lon <input id="lon" type="number" step="0.1" min="-180" max="180" value="-3.7" required>
    <button>Get forecast</button>
    <span id="status"></span>
  </form>
</fieldset>

<div id="tonight"></div>
<div id="events"></div>
<h3>Health</h3>
<pre id="health"></pre>
<details><summary>Raw forecast JSON</summary><pre id="raw"></pre></details>

<script>
const $ = (id) => document.getElementById(id);
const time = (iso) => iso ? new Date(iso).toLocaleString([], { dateStyle: "short", timeStyle: "short" }) : "—";
const esc = (s) => String(s ?? "—").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function setCoords(lat, lon) {
  $("lat").value = lat.toFixed(1);
  $("lon").value = lon.toFixed(1);
  $("coords").requestSubmit();
}

// Geocoding runs in the browser against Open-Meteo, as the app's city picker will.
$("search").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("name").value.trim();
  if (!q) return;
  $("places").textContent = "Searching…";
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=8&name=${encodeURIComponent(q)}`);
    const results = (await r.json()).results || [];
    $("places").innerHTML = results.length ? "" : "No matches.";
    for (const p of results) {
      const b = document.createElement("button");
      b.textContent = `${p.name}, ${p.admin1 ?? ""} ${p.country_code ?? ""} (${p.latitude.toFixed(1)}, ${p.longitude.toFixed(1)})`;
      b.onclick = () => setCoords(p.latitude, p.longitude);
      $("places").append(b);
    }
  } catch (err) {
    $("places").textContent = `Geocoding failed: ${err}`;
  }
};

$("here").onclick = () => navigator.geolocation.getCurrentPosition(
  (pos) => setCoords(pos.coords.latitude, pos.coords.longitude),
  (err) => { $("places").textContent = `Location unavailable: ${err.message}`; },
);

$("coords").onsubmit = async (e) => {
  e.preventDefault();
  const params = new URLSearchParams({ lat: $("lat").value, lon: $("lon").value });
  history.replaceState(null, "", `?${params}`);
  $("status").textContent = "Loading…";
  const t0 = performance.now();
  const r = await fetch(`/v1/sky-forecast?${params}`);
  const body = await r.json();
  $("status").textContent = `${r.status} in ${Math.round(performance.now() - t0)} ms`;
  $("raw").textContent = JSON.stringify(body, null, 2);
  if (!r.ok) { $("tonight").textContent = ""; $("events").textContent = ""; return; }
  render(body);
  $("health").textContent = JSON.stringify(await (await fetch("/health")).json(), null, 2);
};

function render(f) {
  const n = f.tonight;
  $("tonight").innerHTML = `<h3>Tonight</h3>
    <p>Dusk ${time(n.dusk)} → dawn ${time(n.dawn)} · clouds ${esc(n.cloud_cover_percent)}% ${esc(n.condition_code)}
    · highlight: <b>${esc(n.highlight_event_id ?? "none (rest state)")}</b></p>
    <p>Generated ${time(f.generated_at)}, valid until ${time(f.valid_until)}</p>`;
  const rows = f.events.map((e) => {
    const g = e.geometry, w = e.weather, v = e.evaluation;
    return `<tr>
      <td><b>${esc(e.target)}</b><br>${esc(e.category)}<br><small>${esc(e.source)}</small></td>
      <td>${time(e.timing.window_start)} → ${time(e.timing.window_end)}<br>peak ${time(e.timing.peak_time)}<br>${Math.round(e.timing.duration_seconds / 60)} min</td>
      <td>alt ${esc(g.max_elevation_deg)}°<br>${esc(g.start_direction)} → ${esc(g.end_direction)}<br>mag ${esc(g.magnitude)}
        ${g.rate_per_hour != null ? `<br>${g.rate_per_hour}/h, moon ${g.moon_illumination_percent}% at ${g.moon_elevation_deg}°` : ""}</td>
      <td>${w ? `${w.cloud_cover_percent}% ${esc(w.condition_code)}` : "unknown"}</td>
      <td class="${v.is_worth_looking ? "ok" : "no"}">${esc(v.reason_code)}</td>
      <td>notify ${time(e.timing.notify_at)}<br>recheck ${time(e.timing.recheck_at)}</td>
      <td><small>${e.tips.map(esc).join("<br>")}</small></td>
    </tr>`;
  }).join("");
  $("events").innerHTML = `<h3>Events (${f.events.length})</h3>
    <table><tr><th>Event</th><th>When</th><th>Geometry</th><th>Weather</th><th>Verdict</th><th>Alerts</th><th>Tips</th></tr>${rows}</table>`;
}

// Restore coordinates from the URL so a view can be shared/reloaded.
const q = new URLSearchParams(location.search);
if (q.has("lat") && q.has("lon")) { $("lat").value = q.get("lat"); $("lon").value = q.get("lon"); }
$("coords").requestSubmit();
</script>
</body>
</html>
